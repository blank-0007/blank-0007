name: terminal-profile

on:
  push:
    branches: [main]
    paths:
      - profile.config.ts
      - scripts/generate.ts
      - .github/workflows/terminal-profile.yml
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SVGs
        run: npx --yes tsx@4 scripts/generate.ts
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: regenerate terminal profile SVGs"
          git push
